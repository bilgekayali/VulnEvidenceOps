name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  datagovops-e2e:
    name: DataGovOps consumer / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      DEMO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Single-command wheel-installed demo and real-consumer negative tests
        run: python tools/demo_datagovops.py --test --output-dir /tmp/datagovops-e2e-evidence
      - name: Verify complete evidence and publish readable job summary
        run: >-
          python tools/demo_evidence.py /tmp/datagovops-e2e-evidence
          --expected-source-sha "$DEMO_SOURCE_SHA" --report >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-source evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datagovops-evidence-${{ env.DEMO_SOURCE_SHA }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/datagovops-e2e-evidence/
          if-no-files-found: error
          retention-days: 30
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Exercise the synthetic reference case
        if: matrix.python-version == '3.13'
        run: |
          vulnevidenceops schema \
            schemas/case-bundle.schema.json \
            examples/synthetic-case.json
          vulnevidenceops assess examples/synthetic-case.json \
            --policy examples/synthetic-policy.json \
            --as-of 2026-01-20T00:00:00Z \
            --output /tmp/vulnevidenceops-dossier.json
          vulnevidenceops schema \
            schemas/assurance-dossier.schema.json \
            /tmp/vulnevidenceops-dossier.json
          vulnevidenceops intake sarif examples/synthetic-sarif.json \
            --artifact-ref synthetic://intake/sarif.json \
            --collected-at 2026-01-05T00:00:00Z \
            --observed-at 2026-01-04T00:00:00Z \
            --source-identity synthetic-source:reference-v1 \
            --source-ref synthetic-source:export-001 \
            --asset-ref synthetic-asset:repository-001 \
            --synthetic \
            --output /tmp/vulnevidenceops-sarif-intake.json
          vulnevidenceops schema \
            schemas/intake-batch.schema.json \
            /tmp/vulnevidenceops-sarif-intake.json
          vulnevidenceops intake cyclonedx examples/synthetic-cyclonedx.json \
            --artifact-ref synthetic://intake/cyclonedx.json \
            --collected-at 2026-01-05T00:00:00Z \
            --observed-at 2026-01-04T00:00:00Z \
            --source-identity synthetic-source:reference-v1 \
            --source-ref synthetic-source:export-001 \
            --asset-ref-prefix synthetic-component: \
            --synthetic \
            --output /tmp/vulnevidenceops-cyclonedx-intake.json
          vulnevidenceops schema \
            schemas/intake-batch.schema.json \
            /tmp/vulnevidenceops-cyclonedx-intake.json
          vulnevidenceops schema \
            schemas/exposure-context-bundle.schema.json \
            examples/synthetic-exposure-context.json
          vulnevidenceops exposure examples/synthetic-exposure-context.json \
            --as-of 2026-01-20T00:00:00Z \
            --output /tmp/vulnevidenceops-exposure-assessment.json
          vulnevidenceops schema \
            schemas/exposure-context-assessment.schema.json \
            /tmp/vulnevidenceops-exposure-assessment.json
          vulnevidenceops schema \
            schemas/portfolio-bundle.schema.json \
            examples/synthetic-portfolio.json
          vulnevidenceops portfolio examples/synthetic-portfolio.json \
            --as-of 2026-01-20T00:00:00Z \
            --output /tmp/vulnevidenceops-portfolio-view.json
          vulnevidenceops schema \
            schemas/portfolio-assurance-view.schema.json \
            /tmp/vulnevidenceops-portfolio-view.json
          vulnevidenceops schema \
            schemas/build-provenance.schema.json \
            examples/synthetic-build-provenance.json
          vulnevidenceops schema \
            schemas/verification-key.schema.json \
            examples/synthetic-verification-key.json
          vulnevidenceops schema \
            schemas/signed-evidence-envelope.schema.json \
            examples/synthetic-signed-evidence-envelope.json
          vulnevidenceops schema \
            schemas/anchor-receipt.schema.json \
            examples/synthetic-anchor-receipt.json
          vulnevidenceops verify-evidence \
            examples/synthetic-signed-evidence-envelope.json \
            --key examples/synthetic-verification-key.json \
            --receipt examples/synthetic-anchor-receipt.json \
            --as-of 2026-01-20T00:05:00Z \
            --output /tmp/vulnevidenceops-signature-verification.json
          vulnevidenceops schema \
            schemas/signature-verification.schema.json \
            /tmp/vulnevidenceops-signature-verification.json
          vulnevidenceops schema \
            schemas/integration-handoff.schema.json \
            examples/synthetic-datagovops-control-evidence-handoff.json
          vulnevidenceops verify-integration \
            examples/synthetic-datagovops-control-evidence-handoff.json \
            examples/synthetic-assurance-dossier.json \
            --peer-contract \
              examples/peer-contracts/datagovops-control-evidence-reference.schema.json \
            --as-of 2026-01-20T00:15:00Z \
            --output /tmp/vulnevidenceops-integration-verification.json
          vulnevidenceops schema \
            schemas/integration-verification.schema.json \
            /tmp/vulnevidenceops-integration-verification.json
