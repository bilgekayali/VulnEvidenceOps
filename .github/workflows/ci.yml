name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Exercise the synthetic reference case
        if: matrix.python-version == '3.13'
        run: |
          vulnevidenceops schema \
            schemas/case-bundle.schema.json \
            examples/synthetic-case.json
          vulnevidenceops assess examples/synthetic-case.json \
            --policy examples/synthetic-policy.json \
            --as-of 2026-01-20T00:00:00Z \
            --output /tmp/vulnevidenceops-dossier.json
          vulnevidenceops schema \
            schemas/assurance-dossier.schema.json \
            /tmp/vulnevidenceops-dossier.json
