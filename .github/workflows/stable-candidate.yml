name: Stable Candidate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install candidate and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen v1 compatibility surface
        run: python tools/stable_candidate.py --emit --verify
      - name: Verify final-promotion prerequisite or accountable waiver
        run: python tools/stable_candidate.py --require-final-review
