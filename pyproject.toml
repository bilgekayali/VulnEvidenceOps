[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnevidenceops"
version = "0.2.0"
description = "Evidence-backed vulnerability finding, decision, remediation, and verification governance"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bilge Kayalı" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "jsonschema>=4.23,<5",
]
keywords = [
  "vulnerability-management",
  "evidence",
  "cybersecurity",
  "risk-acceptance",
  "remediation",
  "assurance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
vulnevidenceops = "vulnevidenceops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=vulnevidenceops --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
